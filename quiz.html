
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Challenge</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #20132f, #49305d, #8a607e);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
}

.quiz-container {
    width: 100%;
    max-width: 650px;
    background: #fff;
    color: #30243b;
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header .icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.header h1 {
    font-size: 30px;
    color: #51345e;
}

.header p {
    color: #887b91;
    margin-top: 8px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 10px;
    color: #76677e;
}

.progress-bar {
    height: 9px;
    background: #eee7f1;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #79518d, #c18bb0);
    transition: width .3s;
}

.question {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #f8f5fa;
    border: 2px solid #eee7f1;
    border-radius: 13px;
    padding: 16px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    transition: .2s;
    color: #493957;
}

.answer:hover:not(:disabled) {
    border-color: #9165a3;
    background: #f3eaf7;
    transform: translateY(-2px);
}

.answer:disabled {
    cursor: default;
    opacity: 1;
}

.answer.correct {
    background: #e1f6e9;
    border-color: #38a66b;
    color: #17653b;
}

.answer.wrong {
    background: #fde8e8;
    border-color: #df6464;
    color: #9e3030;
}

.feedback {
    display: none;
    padding: 16px;
    border-radius: 12px;
    margin-top: 20px;
    line-height: 1.5;
    font-size: 15px;
}

.feedback.show {
    display: block;
}

.feedback.success {
    background: #e5f7eb;
    color: #17653b;
}

.feedback.error {
    background: #fdecec;
    color: #963c3c;
}

.main-button {
    display: none;
    width: 100%;
    border: none;
    background: linear-gradient(135deg, #68447c, #a16c9e);
    color: white;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 25px;
    transition: .2s;
}

.main-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 20px #68447c44;
}

.result {
    display: none;
    text-align: center;
}

.result .trophy {
    font-size: 75px;
    margin-bottom: 15px;
}

.result h2 {
    font-size: 28px;
    color: #654579;
    margin-bottom: 12px;
}

.score {
    font-size: 58px;
    font-weight: 800;
    color: #8c5c9e;
    margin: 20px 0 5px;
}

.result p {
    color: #786b80;
    line-height: 1.6;
}

.result-details {
    background: #f8f4fa;
    border-radius: 15px;
    padding: 20px;
    margin-top: 25px;
    line-height: 2;
}

.restart {
    display: block;
}

@media(max-width: 480px) {
    .quiz-container {
        padding: 23px 18px;
    }

    .header h1 {
        font-size: 25px;
    }

    .question {
        font-size: 19px;
    }

    .answer {
        font-size: 15px;
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="quiz-container">

    <div class="header">
        <div class="icon">🧠</div>
        <h1>Quiz Challenge</h1>
        <p>Metti alla prova le tue conoscenze!</p>
    </div>

    <div id="quiz">

        <div class="progress-info">
            <span id="questionCounter">Domanda 1 di 10</span>
            <span id="scoreCounter">Punteggio: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="main-button" id="nextButton">
            Prossima domanda →
        </button>

    </div>

    <div class="result" id="result">
        <div class="trophy" id="trophy">🏆</div>
        <h2>Quiz completato!</h2>
        <p>Hai terminato la tua sfida.</p>

        <div class="score" id="finalScore">0%</div>
        <p id="resultMessage"></p>

        <div class="result-details">
            <div>✅ Risposte corrette: <strong id="correctAnswers">0</strong></div>
            <div>❌ Risposte sbagliate: <strong id="wrongAnswers">0</strong></div>
            <div>📚 Domande totali: <strong>10</strong></div>
        </div>

        <button class="main-button restart" onclick="restartQuiz()">
            🔄 Ricomincia il quiz
        </button>
    </div>

</div>

<script>

const questions = [
    {
        question: "Qual è la capitale dell'Australia?",
        answers: ["Sydney", "Melbourne", "Canberra", "Perth"],
        correct: 2,
        explanation: "Canberra è la capitale dell'Australia dal 1927."
    },
    {
        question: "Chi ha dipinto la Gioconda?",
        answers: ["Michelangelo", "Leonardo da Vinci", "Raffaello", "Caravaggio"],
        correct: 1,
        explanation: "La Gioconda è un celebre dipinto di Leonardo da Vinci."
    },
    {
        question: "Qual è il pianeta più grande del sistema solare?",
        answers: ["Saturno", "Terra", "Marte", "Giove"],
        correct: 3,
        explanation: "Giove è il pianeta più grande del nostro sistema solare."
    },
    {
        question: "In quale anno è caduto il muro di Berlino?",
        answers: ["1989", "1991", "1985", "1979"],
        correct: 0,
        explanation: "Il muro di Berlino è caduto il 9 novembre 1989."
    },
    {
        question: "Qual è l'oceano più grande del mondo?",
        answers: ["Atlantico", "Indiano", "Pacifico", "Artico"],
        correct: 2,
        explanation: "L'oceano Pacifico è il più esteso della Terra."
    },
    {
        question: "Quanti lati ha un esagono?",
        answers: ["5", "6", "7", "8"],
        correct: 1,
        explanation: "Un esagono è un poligono con sei lati."
    },
    {
        question: "Chi ha scritto Romeo e Giulietta?",
        answers: ["Dante Alighieri", "Charles Dickens", "William Shakespeare", "Omero"],
        correct: 2,
        explanation: "Romeo e Giulietta è una tragedia di William Shakespeare."
    },
    {
        question: "Quale gas assorbono le piante durante la fotosintesi?",
        answers: ["Ossigeno", "Azoto", "Idrogeno", "Anidride carbonica"],
        correct: 3,
        explanation: "Le piante assorbono anidride carbonica e utilizzano la luce per la fotosintesi."
    },
    {
        question: "Qual è il simbolo chimico dell'oro?",
        answers: ["Ag", "Au", "Fe", "Go"],
        correct: 1,
        explanation: "Il simbolo chimico dell'oro è Au, dal latino Aurum."
    },
    {
        question: "Quanti continenti vengono generalmente riconosciuti nel modello a sette continenti?",
        answers: ["5", "6", "7", "8"],
        correct: 2,
        explanation: "Nel modello a sette continenti si distinguono Asia, Africa, America settentrionale, America meridionale, Antartide, Europa e Oceania."
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const feedbackElement = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionCounter").textContent =
        `Domanda ${currentQuestion + 1} di ${questions.length}`;

    document.getElementById("scoreCounter").textContent =
        `Punteggio: ${score}`;

    document.getElementById("progress").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

    questionElement.textContent = q.question;

    answersElement.innerHTML = "";
    feedbackElement.className = "feedback";
    feedbackElement.textContent = "";

    nextButton.style.display = "none";

    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = `${String.fromCharCode(65 + index)}. ${answer}`;

        button.addEventListener("click", () => checkAnswer(index));

        answersElement.appendChild(button);

    });
}

function checkAnswer(selected) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];
    const buttons = answersElement.querySelectorAll(".answer");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === q.correct) {
            button.classList.add("correct");
        }

        if (index === selected && selected !== q.correct) {
            button.classList.add("wrong");
        }

    });

    if (selected === q.correct) {

        score++;

        feedbackElement.className = "feedback show success";

        feedbackElement.innerHTML =
            `✅ <strong>Risposta corretta!</strong><br>${q.explanation}`;

    } else {

        feedbackElement.className = "feedback show error";

        feedbackElement.innerHTML =
            `❌ <strong>Risposta sbagliata!</strong><br>
            La risposta corretta è: <strong>${q.answers[q.correct]}</strong>.<br>
            ${q.explanation}`;

    }

    document.getElementById("scoreCounter").textContent =
        `Punteggio: ${score}`;

    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? "Scopri il risultato 🏆"
        : "Prossima domanda →";

    nextButton.style.display = "block";
}

nextButton.addEventListener("click", () => {

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }

});

function showResult() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    const percentage = Math.round((score / questions.length) * 100);

    document.getElementById("finalScore").textContent =
        `${percentage}%`;

    document.getElementById("correctAnswers").textContent = score;

    document.getElementById("wrongAnswers").textContent =
        questions.length - score;

    let message;
    let trophy;

    if (percentage === 100) {
        message = "Incredibile! Hai risposto correttamente a tutte le domande!";
        trophy = "🏆";
    } else if (percentage >= 70) {
        message = "Ottimo lavoro! Hai una preparazione eccellente!";
        trophy = "🥇";
    } else if (percentage >= 50) {
        message = "Bravo! Hai buone conoscenze, continua ad allenarti!";
        trophy = "🥈";
    } else {
        message = "Non mollare! Riprova e migliora il tuo punteggio!";
        trophy = "💪";
    }

    document.getElementById("resultMessage").textContent = message;
    document.getElementById("trophy").textContent = trophy;

    document.getElementById("progress").style.width = "100%";
}

function restartQuiz() {

    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
